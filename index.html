<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070d23" />
    <meta
      name="description"
      content="Explore drug discovery assays by measurement, modality, instrument, and provider."
    />
    <title>Emergence Labs · Assay Index</title>
    <link rel="icon" type="image/svg+xml" href="./assets/mark.svg" />
    <link
      rel="preload"
      href="./assets/fonts/instrument-serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./chapter.css" />
    <link rel="stylesheet" href="./directory.css" />
    <link rel="stylesheet" href="./coverage.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" id="skip-link">Skip to content</a>
    <header class="masthead">
      <div class="frame masthead-inner">
        <a href="#/" class="wordmark" aria-label="Emergence Labs Assay Index home"
          ><img src="./assets/mark.svg" width="32" height="32" alt="" />Assay Index</a
        >
        <nav aria-label="Main navigation">
          <a href="#/" data-nav="catalog">Assay catalog</a>
          <a href="#/providers" data-nav="providers">Providers</a>
          <a href="#/coverage" data-nav="coverage">Stage &amp; device plan</a>
        </nav>
        <button class="reader-trigger" type="button" disabled>
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <path
              d="M12 5.5C9 3.7 5.5 3.2 2 4v14c3.5-.8 7-.3 10 1.5 3-1.8 6.5-2.3 10-1.5V4c-3.5-.8-7-.3-10 1.5Zm0 0v14"
            />
          </svg>
          <span>Chapter reader</span>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1" class="frame">
      <p class="loading-message" role="status">Loading the assay catalog…</p>
      <noscript>This catalog requires JavaScript to search and open chapters.</noscript>
    </main>
    <dialog id="reader" aria-label="Assay chapter reader"></dialog>
    <footer class="site-footer">
      <div class="frame">
        <span class="footer-brand"
          ><img src="./assets/mark.svg" width="22" height="22" alt="" />Emergence Labs · Assay Index</span
        >
        <span>Drug discovery reference &nbsp; / &nbsp; 2026 edition</span>
      </div>
    </footer>
  </body>
</html>
